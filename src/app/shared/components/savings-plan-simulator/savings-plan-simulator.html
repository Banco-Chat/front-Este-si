<div class="bg-white border border-gray-200 rounded-2xl shadow-xs p-4 space-y-3">
  <div>
    <p class="text-[11px] uppercase tracking-wide text-gray-400">Meta a simular</p>
    <h3 class="text-lg font-bold text-(--text-color)">{{ targetAmount | currency:'MXN':'symbol-narrow':'1.0-0' }}</h3>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
    @for (option of options; track option.months) {
      <div class="border border-gray-200 rounded-xl p-3 flex flex-col items-center text-center gap-2 hover:border-(--primary-color) transition-colors">
        <p class="text-sm font-bold text-(--text-color)">{{ option.months }} meses</p>
        <p class="text-xs text-gray-400">Aporte mensual</p>
        <p class="text-sm font-semibold text-(--primary-color)">{{ option.monthlyContribution | currency:'MXN':'symbol-narrow':'1.2-2' }}</p>
        <button type="button" (click)="choose(option)" class="w-full h-8 rounded-lg bg-(--primary-color) text-white text-xs font-semibold hover:opacity-90 cursor-pointer">
          Crear esta meta
        </button>
      </div>
    }
  </div>
</div>
