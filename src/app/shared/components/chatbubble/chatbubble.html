<div class="flex w-full mb-3 items-end gap-2" [ngClass]="direction === 'outgoing' ? 'justify-end' : 'justify-start'">
  @if (direction === 'incoming') {
    <div class="w-7 h-7 rounded-full bg-(--primary-color)/10 text-(--primary-color) flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" /></svg>
    </div>
  }
  <div class="max-w-[80%] sm:max-w-[70%] text-xs sm:text-sm px-4 py-3 shadow-sm font-medium leading-relaxed tracking-wide whitespace-pre-line transition-all" [ngClass]="direction === 'outgoing' ? 'bg-(--primary-color) text-white rounded-2xl rounded-br-xs' : 'bg-white border border-gray-100 text-(--text-color) rounded-2xl rounded-bl-xs'">{{ message }}</div>
</div>
